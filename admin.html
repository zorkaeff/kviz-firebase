<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Kviz – Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background:#111;
  color:white;
  padding:20px;
}

button {
  padding:10px 16px;
  font-size:16px;
  margin:5px;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td {
  border:1px solid #444;
  padding:6px;
  text-align:center;
}

input {
  padding:8px;
  font-size:16px;
}
</style>
</head>

<body>

<h2>ADMIN PANEL</h2>

<div id="login">
  <input id="adminKey" placeholder="Admin šifra">
  <button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">

  <h3>Kontrole</h3>
  <button onclick="startGame()">START</button>
  <button onclick="nextQuestion()">NEXT QUESTION</button>
  <button onclick="startQuestionMark()">? FAZA</button>
  <button onclick="reveal()">REVEAL</button>
  <button onclick="pause()">PAUSE</button>
  <button onclick="eliminate()">ELIMINATE</button>

  <h3>Status igre</h3>
  <div id="status"></div>

  <h3>Leaderboard</h3>
  <table id="leaderboard"></table>

</div>

<script>
// ================= ADMIN CONFIG =================
const ADMIN_KEY = "ADMIN123"; // PROMIJENI PO ŽELJI

// ================= FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef",
  storageBucket: "hpddd-b9bef.appspot.com",
  messagingSenderId: "520105963434",
  appId: "1:520105963434:web:5b25d1f9f28512ae1145d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= LOGIN =================
function login() {
  if (document.getElementById("adminKey").value === ADMIN_KEY) {
    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
  } else {
    alert("Pogrešna šifra");
  }
}

// ================= QUESTIONS =================
let rounds = {};
let round = 1;
let questionIndex = 0;

fetch("question.json")
  .then(r => r.json())
  .then(data => {
    rounds = data.rounds;
    document.getElementById("status").innerText = "Pitanja učitana";
  });

// ================= GAME CONTROL =================
function startGame() {
  db.ref("game").set({
    phase: "waiting"
  });
}

function nextQuestion() {
  const q = rounds[round].questions[questionIndex];
  questionIndex++;

  if (!q) {
    alert("Nema više pitanja u ovom krugu");
    return;
  }

  db.ref("game").set({
    phase: "main",
    round,
    question: questionIndex,
    questionText: q.text,
    correct: q.correct,
    phaseEndsAt: Date.now() + 20000
  });
}

function startQuestionMark() {
  db.ref("game").update({
    phase: "questionMark",
    phaseEndsAt: Date.now() + 10000
  });
}

function reveal() {
  db.ref("game").update({
    phase: "reveal",
    phaseEndsAt: Date.now() + 10000
  });
}

function pause() {
  db.ref("game").update({
    phase: "waiting"
  });
}

// ================= ELIMINATION =================
function eliminate() {
  db.ref("results").once("value", snap => {
    const players = [];

    snap.forEach(c => {
      const r = c.val();
      players.push({
        name: c.key,
        points: r.points || 0,
        question: r.question || 0,
        exclam: r.exclam || 0,
        time: r.time || 0
      });
    });

    players.sort((a, b) => {
      if (a.points !== b.points) return b.points - a.points;
      if (a.question !== b.question) return b.question - a.question;
      if (a.exclam !== b.exclam) return b.exclam - a.exclam;
      return a.time - b.time;
    });

    const out = players[players.length - 1];
    if (out) {
      db.ref("eliminated/" + out.name).set(true);
      alert("Ispao: " + out.name);
    }
  });
}

// ================= LEADERBOARD =================
db.ref("results").on("value", snap => {
  let html = `
    <tr>
      <th>Igrač</th>
      <th>Bodovi</th>
      <th>?</th>
      <th>!</th>
      <th>Vrijeme</th>
    </tr>
  `;

  snap.forEach(c => {
    const r = c.val();
    html += `
      <tr>
        <td>${c.key}</td>
        <td>${r.points || 0}</td>
        <td>${r.question || 0}</td>
        <td>${r.exclam || 0}</td>
        <td>${r.time || 0}</td>
      </tr>
    `;
  });

  document.getElementById("leaderboard").innerHTML = html;
});
</script>

</body>
</html>
