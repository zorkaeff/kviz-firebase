<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<title>Kviz – Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#111;color:white;padding:20px}
button{padding:10px 16px;font-size:16px;margin:4px;cursor:pointer}
select{padding:6px;font-size:16px}
.card{border:1px solid #333;padding:12px;margin-bottom:12px}
.red{background:#a00;color:white}
.green{background:#0a0;color:white}
</style>
</head>
<body>

<h1>ADMIN PANEL</h1>

<div class="card">
  <h3>Stanje igre</h3>
  <div id="state">—</div>
  <button onclick="pauseGame()">⏸ Pause</button>
  <button onclick="resumeGame()">▶ Resume</button>
</div>

<div class="card">
  <h3>Odabir pitanja</h3>
  Krug:
  <select id="round"></select>
  Pitanje:
  <select id="question"></select>
  <br><br>
  <button class="green" onclick="startQuestion()">▶ Start pitanje</button>
</div>

<div class="card">
  <h3>Faze</h3>
  <button onclick="setPhase('main')">Main (20s)</button>
  <button onclick="setPhase('questionMark')">? faza (10s)</button>
  <button onclick="setPhase('reveal')">Reveal</button>
  <button onclick="setPhase('leaderboard')">Leaderboard</button>
</div>

<div class="card">
  <h3>Live odgovori</h3>
  <div id="answers">—</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef",
  storageBucket: "hpddd-b9bef.appspot.com",
  messagingSenderId: "520105963434",
  appId: "1:520105963434:web:5b25d1f9f28512ae1145d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const roundSel = document.getElementById('round');
const questionSel = document.getElementById('question');

// učitaj krugove i pitanja
db.ref('questions/rounds').once('value', snap => {
  snap.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.key;
    opt.innerText = 'Krug ' + r.key;
    roundSel.appendChild(opt);
  });
  loadQuestions();
});

roundSel.onchange = loadQuestions;

function loadQuestions(){
  questionSel.innerHTML='';
  db.ref(`questions/rounds/${roundSel.value}/questions`).once('value', snap => {
    snap.forEach(q => {
      const opt = document.createElement('option');
      opt.value = q.key;
      opt.innerText = q.val().text;
      questionSel.appendChild(opt);
    });
  });
}

function startQuestion(){
  const r = roundSel.value;
  const q = questionSel.value;
  db.ref(`questions/rounds/${r}/questions/${q}`).once('value', snap => {
    const data = snap.val();
    db.ref('game').set({
      phase: 'main',
      round: r,
      question: q,
      questionText: data.text,
      answers: data.answers,
      correct: data.correct,
      phaseEndsAt: Date.now() + 20000,
      paused: false
    });
  });
}

function setPhase(p){
  let duration = 0;
  if(p==='main') duration = 20000;
  if(p==='questionMark') duration = 10000;
  db.ref('game').update({
    phase: p,
    phaseEndsAt: duration ? Date.now()+duration : null
  });
}

function pauseGame(){
  db.ref('game').update({ paused:true });
}
function resumeGame(){
  db.ref('game').update({ paused:false });
}

// stanje igre
db.ref('game').on('value', snap => {
  document.getElementById('state').innerText = JSON.stringify(snap.val(), null, 2);
});

// live odgovori
db.ref('answers').on('value', snap => {
  const out=[];
  snap.forEach(q=>{
    q.forEach(p=> out.push(p.key+': '+p.val().choice));
  });
  document.getElementById('answers').innerText = out.join('\n');
});
</script>
</body>
</html>
