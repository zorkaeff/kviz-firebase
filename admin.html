<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Kviz – Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  background:#111;
  color:white;
  font-family:Arial;
  padding:20px;
}

button {
  padding:10px 18px;
  font-size:16px;
  margin:6px;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td {
  border:1px solid #444;
  padding:6px;
  text-align:center;
}

#answers td {
  font-size:14px;
}
</style>
</head>

<body>

<h2>ADMIN PANEL</h2>

<div id="login">
  <input id="key" placeholder="Admin šifra">
  <button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">

<h3>Status</h3>
<div id="status">—</div>

<h3>Kontrole</h3>
<button onclick="startGame()">START IGRE</button>
<button onclick="nextQuestion()">SLJEDEĆE PITANJE</button>

<h3>Odgovori igrača</h3>
<table id="answers"></table>

</div>

<script>
// ===== ADMIN CONFIG =====
const ADMIN_KEY = "ADMIN123"; // promijeni po želji

// ===== FIREBASE =====
firebase.initializeApp({
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app"
});
const db = firebase.database();

// ===== LOGIN =====
function login() {
  if (document.getElementById("key").value === ADMIN_KEY) {
    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
  } else {
    alert("Pogrešna šifra");
  }
}

// ===== QUESTIONS =====
let rounds = {};
let round = 1;
let qi = 0;

fetch("question.json")
  .then(r => r.json())
  .then(d => {
    rounds = d.rounds;
    document.getElementById("status").innerText = "Pitanja učitana";
  });

// ===== GAME FLOW =====
function startGame() {
  db.ref("game").set({ phase: "waiting" });
  document.getElementById("status").innerText = "Igra pokrenuta";
}

function nextQuestion() {
  const q = rounds[round]?.questions[qi];
  if (!q) {
    alert("Nema više pitanja u ovom krugu");
    return;
  }

  qi++;

  const qid = q.id;

  // očisti stare odgovore
  db.ref("answers/" + qid).remove();

  // POŠALJI PITANJE
  db.ref("game").set({
    phase: "question",
    qid: qid,
    text: q.text,
    answers: q.answers,
    correct: q.correct,
    endsAt: Date.now() + 20000
  });

  document.getElementById("status").innerText =
    `Pitanje ${qid} – GLAVNA FAZA`;

  // AUTOMATSKI REVEAL
  setTimeout(() => {
    db.ref("game").update({
      phase: "reveal"
    });
    document.getElementById("status").innerText =
      `Pitanje ${qid} – REVEAL`;
  }, 20000);
}

// ===== ANSWERS LISTENER =====
db.ref("answers").on("value", snap => {
  let html = `
    <tr>
      <th>Igrač</th>
      <th>Odgovor</th>
      <th>Vrijeme</th>
    </tr>
  `;

  snap.forEach(q => {
    q.forEach(p => {
      const a = p.val();
      html += `
        <tr>
          <td>${p.key}</td>
          <td>${a.answer}</td>
          <td>${a.time ? new Date(a.time).toLocaleTimeString() : ""}</td>
        </tr>
      `;
    });
  });

  document.getElementById("answers").innerHTML = html;
});
</script>

</body>
</html>
