<body>

<h1>ADMIN</h1>

<script>
/* ADMIN KEY */
const ADMIN_KEY = "kviz123";
const k = prompt("Admin lozinka:");
if(k !== ADMIN_KEY){
  document.body.innerHTML = "<h1>Pristup zabranjen</h1>";
  throw new Error("NO ADMIN");

</script>

<script>
/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef",
  storageBucket: "hpddd-b9bef.appspot.com",
  messagingSenderId: "520105963434",
  appId: "1:520105963434:web:5b25d1f9f28512ae1145d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* INIT */
let round = 1;
let index = 0;

/* RESET */
function resetGame(){
  db.ref("game").set({ phase:"waiting" });
  db.ref("answers").remove();
}
resetGame();

/* CONTROLS */
async function startQuestion(){
  const snap = await db.ref(`rounds/${round}/questions/${index}`).once("value");
  const q = snap.val();

  db.ref("answers").remove();

  db.ref("game").set({
    phase:"question",
    round,
    index,
    text:q.text,
    correct:q.correct,
    phaseEndsAt: Date.now() + 20000
  });
}

function reveal(){
  db.ref("game").update({
    phase:"reveal",
    phaseEndsAt: Date.now() + 10000
  });
}

async function autoEliminate(){
  const snap = await db.ref("results").once("value");
  let list = [];
  snap.forEach(p=>{
    const r = p.val();
    list.push({
      name:p.key,
      points:r.points||0,
      q:r.question||0,
      ex:r.exclam||0,
      time:r.time||0
    });
  });

  list.sort((a,b)=>{
    if(a.points!==b.points) return a.points-b.points;
    if(a.q!==b.q) return b.q-a.q;
    if(a.ex!==b.ex) return b.ex-a.ex;
    return b.time-a.time;
  });

  if(list.length){
    db.ref(`players/${list[0].name}/eliminated`).set(true);
    alert("Eliminiran: " + list[0].name);
  }
}

function exportCSV(){
  db.ref("results").once("value",snap=>{
    let csv="Igrač,Bodovi,?,!,Vrijeme\n";
    snap.forEach(p=>{
      const r=p.val();
      csv+=`${p.key},${r.points||0},${r.question||0},${r.exclam||0},${r.time||0}\n`;
    });
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv]));
    a.download="rezultati.csv";
    a.click();
  });
}
</script>

<button onclick="startQuestion()">START PITANJE</button>
<button onclick="reveal()">REVEAL</button>
<button onclick="autoEliminate()">ELIMINACIJA</button>
<button onclick="exportCSV()">EXPORT CSV</button>

</body>
</html>
