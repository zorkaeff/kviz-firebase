<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>ADMIN – Kviz</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { font-family:Arial; background:#222; color:#fff; }
button { padding:10px; font-size:16px; margin:5px; }
table { border-collapse:collapse; margin-top:10px; }
td,th { border:1px solid #555; padding:6px 10px; }
</style>
</head>
<body>

<h1>ADMIN</h1>

<button onclick="startQuestion()">START PITANJE</button>
<button onclick="reveal()">REVEAL</button>
<button onclick="autoEliminate()">ELIMINACIJA</button>
<button onclick="exportCSV()">EXPORT CSV</button>

<h2>Leaderboard</h2>
<table id="board"></table>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef",
  storageBucket: "hpddd-b9bef.appspot.com",
  messagingSenderId: "520105963434",
  appId: "1:520105963434:web:5b25d1f9f28512ae1145d3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let round=1, index=0;

async function startQuestion(){
  const qSnap=await db.ref(`rounds/${round}/questions/${index}`).once("value");
  const q=qSnap.val();

  db.ref("game").set({
    phase:"question",
    round,
    index,
    text:q.text,
    correct:q.correct,
    phaseEndsAt:Date.now()+20000
  });
}

function reveal(){
  db.ref("game").update({
    phase:"reveal",
    phaseEndsAt:Date.now()+10000
  });

  db.ref("answers").once("value",snap=>{
    snap.forEach(q=>{
      q.forEach(p=>{
        const {choice}=p.val();
        const mod=choice[1];
        const ok=choice[0]===db.ref("game/correct");
      });
    });
  });
}

async function autoEliminate(){
  const rSnap=await db.ref("results").once("value");
  let list=[];
  rSnap.forEach(p=>{
    const r=p.val();
    list.push({
      name:p.key,
      points:r.points||0,
      q:r.question||0,
      ex:r.exclam||0,
      time:r.time||0
    });
  });

  list.sort((a,b)=>{
    if(a.points!==b.points) return a.points-b.points;
    if(a.q!==b.q) return b.q-a.q;
    if(a.ex!==b.ex) return b.ex-a.ex;
    return b.time-a.time;
  });

  db.ref(`players/${list[0].name}/eliminated`).set(true);
}

function exportCSV(){
  db.ref("results").once("value",snap=>{
    let csv="Igrač,Bodovi,?,!,Vrijeme\n";
    snap.forEach(p=>{
      const r=p.val();
      csv+=`${p.key},${r.points||0},${r.question||0},${r.exclam||0},${r.time||0}\n`;
    });
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv]));
    a.download="rezultati.csv";
    a.click();
  });
}
</script>
</body>
</html>
