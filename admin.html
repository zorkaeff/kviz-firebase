<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Kviz – Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { background:#111; color:white; font-family:Arial; padding:20px; }
button { padding:10px 16px; font-size:16px; margin:4px; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
td,th { border:1px solid #444; padding:6px; text-align:center; }
</style>
</head>

<body>

<h2>ADMIN</h2>

<div id="loginBox">
  <input id="key" placeholder="Admin šifra">
  <button onclick="adminLogin()">LOGIN</button>
</div>

<div id="panel" style="display:none">

<button onclick="startQuiz()">START KVIZA</button>

<h3>Status</h3>
<div id="status"></div>

<h3>Leaderboard</h3>
<table id="board"></table>

</div>

<script>
const ADMIN_KEY="ADMIN123";

// FIREBASE
firebase.initializeApp({
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef"
});
const db=firebase.database();

// LOGIN
function adminLogin(){
  if(document.getElementById("key").value===ADMIN_KEY){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("panel").style.display="block";
  } else alert("Pogrešna šifra");
}

// LOAD QUESTIONS
let questions=[];
fetch("question.json").then(r=>r.json()).then(d=>{
  Object.values(d.rounds).forEach(r=>{
    r.questions.forEach(q=>questions.push(q));
  });
});

// START QUIZ
let qi=0;
function startQuiz(){
  next();
}

function next(){
  const q=questions[qi++];
  if(!q){ alert("Kraj"); return; }

  const key=q.id;
  db.ref("game").set({
    phase:"question",
    key,
    text:q.text,
    answers:q.answers,
    correct:q.correct,
    endsAt:Date.now()+20000
  });

  setTimeout(()=>reveal(q),20000);
}

function reveal(q){
  db.ref("game").update({
    phase:"reveal",
    endsAt:Date.now()+5000
  });
  setTimeout(next,5000);
}

// LEADERBOARD
db.ref("results").on("value",snap=>{
  let h="<tr><th>Igrač</th><th>Bodovi</th><th>?</th><th>!</th><th>Vrijeme</th></tr>";
  snap.forEach(c=>{
    const r=c.val();
    h+=`<tr><td>${c.key}</td><td>${r.points||0}</td><td>${r.question||0}</td><td>${r.exclam||0}</td><td>${r.time||0}</td></tr>`;
  });
  document.getElementById("board").innerHTML=h;
});
</script>
</body>
</html>
