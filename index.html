<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<title>Kviz</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background:#111;
  color:white;
  text-align:center;
  margin:0;
}

#top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
}

#timer {
  font-size:48px;
  color:yellow;
}

#round {
  font-size:20px;
}

#question {
  font-size:28px;
  margin:20px;
}

#answers {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  max-width:420px;
  margin:0 auto;
}

button {
  padding:18px;
  font-size:22px;
  cursor:pointer;
}

.locked button {
  opacity:0.4;
  pointer-events:none;
}

#status {
  margin-top:20px;
  font-size:18px;
  color:#ccc;
}

#waiting {
  margin-top:10px;
  font-size:16px;
  color:#aaa;
}
</style>
</head>

<body>

<div id="top">
  <div id="round">—</div>
  <div id="timer">--</div>
</div>

<div id="question">Čekanje admina…</div>
<div id="answers"></div>

<div id="status"></div>
<div id="waiting"></div>

<script>
// ================= FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef",
  storageBucket: "hpddd-b9bef.appspot.com",
  messagingSenderId: "520105963434",
  appId: "1:520105963434:web:5b25d1f9f28512ae1145d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= PLAYER =================
let player = localStorage.getItem("player");
if (!player) {
  player = prompt("Unesi ime igrača");
  localStorage.setItem("player", player);
}

db.ref("players/" + player).set({
  joined: Date.now()
});

// ================= STATE =================
let currentKey = null;
let answered = false;

// ================= RENDER =================
function renderAnswers(allowQuestionMark) {
  const wrap = document.getElementById("answers");
  wrap.innerHTML = "";
  wrap.classList.remove("locked");

  ["A","B","C","D"].forEach(l => {
    ["!", "."].forEach(s => {
      const b = document.createElement("button");
      b.innerText = l + s;
      b.onclick = () => submitAnswer(l + s);
      wrap.appendChild(b);
    });
    if (allowQuestionMark) {
      const q = document.createElement("button");
      q.innerText = l + "?";
      q.onclick = () => submitAnswer(l + "?");
      wrap.appendChild(q);
    }
  });
}

// ================= SUBMIT =================
function submitAnswer(choice) {
  if (answered) return;
  answered = true;

  db.ref(`answers/${currentKey}/${player}`).set({
    choice,
    time: Date.now()
  });

  document.getElementById("answers").classList.add("locked");
  document.getElementById("status").innerText = "Odgovor spremljen";
}

// ================= WAITING =================
function updateWaiting() {
  if (!currentKey) return;

  db.ref("players").once("value", pSnap => {
    db.ref(`answers/${currentKey}`).once("value", aSnap => {
      const waiting = [];
      pSnap.forEach(p => {
        if (!aSnap.hasChild(p.key)) waiting.push(p.key);
      });
      document.getElementById("waiting").innerText =
        waiting.length ? "Čekamo: " + waiting.join(", ") : "Svi su odgovorili";
    });
  });
}
setInterval(updateWaiting, 1000);

// ================= GAME LISTENER =================
db.ref("game").on("value", snap => {
  const g = snap.val();
  if (!g) return;

  document.getElementById("round").innerText =
    `Krug ${g.round} · Pitanje ${g.question}`;

  // TIMER
  if (g.phaseEndsAt) {
    clearInterval(window.t);
    const tick = () => {
      const left = Math.max(0, Math.ceil((g.phaseEndsAt - Date.now()) / 1000));
      document.getElementById("timer").innerText = left + "s";
    };
    tick();
    window.t = setInterval(tick, 1000);
  }

  // FAZE
  if (g.phase === "waiting") {
    document.getElementById("question").innerText = "Čekanje admina…";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("status").innerText = "";
    return;
  }

  if (g.phase === "main" || g.phase === "questionMark") {
    currentKey = `${g.round}_${g.question}`;
    answered = false;

    document.getElementById("question").innerText = g.questionText;
    document.getElementById("status").innerText =
      g.phase === "questionMark" ? "? faza" : "Odaberi odgovor";

    renderAnswers(g.phase === "questionMark");
  }

  if (g.phase === "reveal") {
    document.getElementById("answers").innerHTML =
      `<h3>Točan odgovor: ${g.correct}</h3>`;
    document.getElementById("status").innerText = "Rezultati";
  }
});
</script>

</body>
</html>
