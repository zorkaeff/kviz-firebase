/* ================= JOIN ================= */
function join(){
  const n=document.getElementById("name").value.trim();
  if(!n) watching=true;
  else me=n;

  document.getElementById("join").style.display="none";
  document.getElementById("game").style.display="block";
}

/* ================= GAME LOOP ================= */
db.ref("state").on("value",snap=>{
  const s=snap.val();
  if(!s) return;

  document.getElementById("question").innerText=s.text||"";
  document.getElementById("timer").innerText=s.remaining+"s";

  renderAnswers(s);
});

function renderAnswers(s){
  const div=document.getElementById("answers");
  div.innerHTML="";

  if(watching) return;

  if(s.phase==="main"){
    ["A","B","C","D","!","?"].forEach(x=>{
      btn(x);
    });
  }
  if(s.phase==="q"){
    ["A?","B?","C?","D?"].forEach(x=>{
      btn(x);
    });
  }

  function btn(x){
    const b=document.createElement("button");
    b.innerText=x;
    b.onclick=()=>answer(x);
    div.appendChild(b);
  }
}

function answer(a){
  if(!me) return;
  db.ref("answers/"+me).set({
    a,
    t:Date.now()
  });
}

/* ================= LEADERBOARD ================= */
db.ref("scores").on("value",snap=>{
  let arr=[];
  snap.forEach(c=>arr.push({n:c.key,...c.val()}));

  arr.sort((a,b)=>{
    if(a.points!==b.points) return b.points-a.points;
    if(a.q!==b.q) return b.q-a.q;
    if(a.ex!==b.ex) return b.ex-a.ex;
    return a.time-b.time;
  });

  let html="<tr><th>#</th><th>Igrač</th><th>Bodovi</th><th>?</th><th>!</th><th>Vrijeme</th></tr>";
  arr.forEach((p,i)=>{
    html+=`<tr><td>${i+1}</td><td>${p.n}</td><td>${p.points}</td><td>${p.q}</td><td>${p.ex}</td><td>${p.time}</td></tr>`;
  });
  document.getElementById("board").innerHTML=html;
});

/* ================= LIVE ANSWERS ================= */
db.ref("answers").on("value",snap=>{
  let txt="LIVE: ";
  snap.forEach(c=>{
    txt+=`${c.key}:${c.val().a} `;
  });
  document.getElementById("live").innerText=txt;
});

/* ================= TIMER DRIVER ================= */
setInterval(()=>{
  const now=Date.now();
  if(now<START_TIME) return;

  db.ref("engine").transaction(e=>{
    if(!e) return {i:0,phase:"main",ends:now+20000};

    if(now>e.ends){
      if(e.phase==="main") return {...e,phase:"q",ends:now+10000};
      if(e.phase==="q") return {...e,phase:"reveal",ends:now+5000};
      return {i:e.i+1,phase:"main",ends:now+20000};
    }
    return e;
  });
},1000);

/* ================= SYNC STATE ================= */
db.ref("engine").on("value",snap=>{
  const e=snap.val();
  if(!e||!questions[e.i]) return;

  const rem=Math.max(0,Math.ceil((e.ends-Date.now())/1000));

  db.ref("state").set({
    phase:e.phase,
    text:questions[e.i].text,
    remaining:rem
  });
});
