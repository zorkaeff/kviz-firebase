<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<title>LIVE KVIZ</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

.hidden { display: none; }

button {
  padding: 14px;
  margin: 6px;
  font-size: 18px;
  cursor: pointer;
  width: 80%;
  max-width: 400px;
}

.answer { background:#222; color:white; }
.answer:hover { background:#333; }

#players span {
  display: inline-block;
  margin: 4px;
  padding: 4px 8px;
  background: #333;
}
</style>
</head>

<body>

<h1>LIVE KVIZ</h1>

<div id="waiting">
  <h2 id="countdown">Kviz još nije počeo</h2>
</div>

<div id="join">
  <input id="playerName" placeholder="Ime igrača" />
  <br><br>
  <button onclick="joinGame()">ULAZ</button>
  <button onclick="watchMode()">WATCH MODE</button>
</div>

<div id="quiz" class="hidden">
  <h2 id="roundInfo"></h2>
  <h2 id="questionText"></h2>
  <div id="answers"></div>
  <h3 id="timer"></h3>
  <div id="players"></div>
</div>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= QUIZ TIME ================= */
const QUIZ_START = new Date("2026-01-13T17:30:00Z");
let started = false;

/* ================= GAME DATA ================= */
let player = null;
let watch = false;
let currentIndex = 0;
let phase = "waiting";

/* ================= QUESTIONS ================= */
/* OVDJE UBACIŠ SVIH 60 PITANJA */
const QUESTIONS = [
  {
    round: 1,
    value: 10,
    text: "Koji je glavni grad Hrvatske?",
    answers: { A:"Split", B:"Rijeka", C:"Zagreb", D:"Osijek" },
    correct: "C"
  },
  {
    round: 1,
    value: 10,
    text: "Koliko dana ima prijestupna godina?",
    answers: { A:"365", B:"366", C:"364", D:"367" },
    correct: "B"
  }
  // ← nastavi do 60
];

/* ================= TIMER ================= */
setInterval(() => {
  const now = new Date();
  const diff = QUIZ_START - now;

  if (!started && diff <= 0) {
    started = true;
    startQuiz();
  }

  if (!started) {
    const m = Math.floor(diff / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById("countdown").innerText =
      `Počinje za ${m}:${s.toString().padStart(2,"0")}`;
  }
}, 500);

/* ================= JOIN ================= */
function joinGame() {
  const name = document.getElementById("playerName").value.trim();
  if (!name) return alert("Upiši ime");

  player = name;
  db.ref("players/"+player).set({
    points:0, q:0, ex:0, time:0
  });

  document.getElementById("join").classList.add("hidden");
}

function watchMode() {
  watch = true;
  document.getElementById("join").classList.add("hidden");
}

/* ================= START QUIZ ================= */
function startQuiz() {
  document.getElementById("waiting").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  db.ref("game").set({
    index: 0,
    phase: "main",
    ends: Date.now() + 20000
  });
}

/* ================= GAME LISTENER ================= */
db.ref("game").on("value", snap => {
  if (!snap.exists()) return;
  const g = snap.val();

  currentIndex = g.index;
  phase = g.phase;

  renderQuestion();
});

/* ================= RENDER ================= */
function renderQuestion() {
  const q = QUESTIONS[currentIndex];
  if (!q) return;

  document.getElementById("roundInfo").innerText =
    `Krug ${q.round} – vrijednost ${q.value}`;

  document.getElementById("questionText").innerText = q.text;

  const box = document.getElementById("answers");
  box.innerHTML = "";

  Object.keys(q.answers).forEach(k => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.innerText = `${k}: ${q.answers[k]}`;
    btn.onclick = () => answer(k);
    if (watch) btn.disabled = true;
    box.appendChild(btn);
  });
}

/* ================= ANSWER ================= */
function answer(letter) {
  if (!player) return;

  db.ref("answers/"+currentIndex+"/"+player).set({
    answer: letter,
    time: Date.now()
  });
}

/* ================= LIVE ANSWERS ================= */
db.ref("answers").on("value", snap => {
  const box = document.getElementById("players");
  box.innerHTML = "";

  if (!snap.exists()) return;

  const qSnap = snap.child(currentIndex);
  qSnap.forEach(p => {
    const span = document.createElement("span");
    span.innerText = `${p.key}: ${p.val().answer}`;
    box.appendChild(span);
  });
});
</script>

</body>
</html>
