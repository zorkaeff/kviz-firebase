<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Kviz</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
#question { font-size:26px; margin:20px; }
#timer { font-size:42px; color:yellow; }
#answers {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  max-width:400px;
  margin:30px auto;
}
button {
  padding:16px;
  font-size:20px;
  cursor:pointer;
}
.locked button {
  opacity:0.5;
  pointer-events:none;
}
</style>
</head>

<body>

<h2>KVIZ</h2>
<div id="timer">--</div>
<div id="question">Čekamo admina…</div>
<div id="answers"></div>

<script>
// ===== PLAYER =====
let player = localStorage.getItem("player");
if (!player) {
  player = prompt("Ime igrača");
  localStorage.setItem("player", player);
}

// ===== FIREBASE =====
firebase.initializeApp({
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app"
});
const db = firebase.database();

let answered = false;
let qid = null;

// ===== TIMER =====
function startTimer(end) {
  clearInterval(window.t);
  window.t = setInterval(() => {
    const s = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    document.getElementById("timer").innerText = s + "s";
  }, 300);
}

// ===== ANSWERS =====
function renderAnswers(a) {
  const div = document.getElementById("answers");
  div.classList.remove("locked");
  div.innerHTML = "";

  Object.entries(a).forEach(([key, text]) => {
    const b = document.createElement("button");
    b.innerText = key + ": " + text;
    b.onclick = () => answer(key);
    div.appendChild(b);
  });
}

function answer(letter) {
  if (answered || !qid) return;
  answered = true;

  db.ref(`answers/${qid}/${player}`).set({
    answer: letter,
    time: Date.now()
  });

  document.getElementById("answers").classList.add("locked");
}

// ===== GAME LISTENER =====
db.ref("game").on("value", snap => {
  const g = snap.val();
  if (!g) return;

  if (g.phase === "waiting") {
    document.getElementById("question").innerText = "Čekamo sljedeće pitanje…";
    document.getElementById("answers").innerHTML = "";
    return;
  }

  if (g.phase === "question") {
    answered = false;
    qid = g.qid;

    document.getElementById("question").innerText = g.text;
    renderAnswers(g.answers);
    startTimer(g.endsAt);
  }

  if (g.phase === "reveal") {
    document.getElementById("answers").innerHTML =
      `<b>Točan odgovor: ${g.correct}</b>`;
  }
});
</script>

</body>
</html>
