<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Kviz</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { background:#111; color:#fff; font-family:Arial; text-align:center; }
#timer { font-size:60px; color:yellow; margin:10px; }
#meta { font-size:18px; opacity:0.8; }
#question { font-size:30px; margin:20px; min-height:60px; }
#answers {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  max-width:420px;
  margin:auto;
}
button {
  font-size:26px;
  padding:18px;
  cursor:pointer;
}
.locked button {
  opacity:0.4;
  pointer-events:none;
}
</style>
</head>
<body>

<h1>KVIZ</h1>
<div id="meta">
  Krug <span id="round">-</span> |
  Pitanje <span id="qnum">-</span>
</div>

<div id="timer">--</div>
<div id="question">Čekanje admina…</div>
<div id="answers"></div>
<div id="status"></div>

<script>
/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef",
  storageBucket: "hpddd-b9bef.appspot.com",
  messagingSenderId: "520105963434",
  appId: "1:520105963434:web:5b25d1f9f28512ae1145d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* IGRAČ */
let player = localStorage.getItem("player");
if(!player){
  player = prompt("Ime igrača:");
  localStorage.setItem("player", player);
}
db.ref(`players/${player}`).set({
  joined: Date.now(),
  eliminated: false
});

/* STATE */
let answered = false;
let currentKey = null;

/* UI */
function renderAnswers(){
  const a = document.getElementById("answers");
  a.innerHTML = "";
  ['A','B','C','D'].forEach(l=>{
    ['!','.','?'].forEach(s=>{
      const b = document.createElement("button");
      b.innerText = l+s;
      b.onclick = ()=>submit(l+s);
      a.appendChild(b);
    });
  });
}

function submit(choice){
  if(answered) return;
  answered = true;
  db.ref(`answers/${currentKey}/${player}`).set({
    choice,
    time: Date.now()
  });
  document.getElementById("answers").classList.add("locked");
}

/* GAME LISTENER */
db.ref("game").on("value", snap=>{
  const g = snap.val();
  if(!g || g.phase === "waiting"){
    document.getElementById("question").innerText = "Čekanje admina…";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("timer").innerText = "--";
    return;
  }

  if(g.phase === "question"){
    answered = false;
    currentKey = `${g.round}_${g.index}`;
    document.getElementById("round").innerText = g.round;
    document.getElementById("qnum").innerText = g.index + 1;
    document.getElementById("question").innerText = g.text;
    document.getElementById("answers").classList.remove("locked");
    renderAnswers();
  }

  if(g.phase === "reveal"){
    document.getElementById("answers").innerHTML =
      `Točan odgovor: <b>${g.correct}</b>`;
  }

  if(g.phaseEndsAt){
    clearInterval(window.t);
    window.t = setInterval(()=>{
      const s = Math.max(0, Math.ceil((g.phaseEndsAt - Date.now())/1000));
      document.getElementById("timer").innerText = s;
    },1000);
  }
});
</script>
</body>
</html>

.locked button { opacity:0.4; pointer-events:none; }
</style>
