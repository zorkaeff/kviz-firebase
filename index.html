<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Kviz</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
}
#timer {
  font-size:48px;
  color:yellow;
  margin:20px;
}
.answers button {
  width:140px;
  height:60px;
  font-size:22px;
  margin:6px;
}
#live span {
  display:block;
  font-size:18px;
  margin:2px;
}
.locked button {
  opacity:0.4;
  pointer-events:none;
}
</style>
</head>
<body>

<h2 id="status">Čekanje početka kviza…</h2>
<div id="timer">--</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<h3>LIVE ODGOVORI</h3>
<div id="live"></div>

<script>
// ================== FIREBASE ==================
firebase.initializeApp({
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef"
});
const db = firebase.database();

// ================== POSTAVKE ==================
const QUIZ_START = new Date("2026-01-13T18:30:00+01:00").getTime();
const MAIN_TIME = 20; // sekundi
const QMARK_TIME = 10;

// TEST PITANJE (kasnije ide 60)
const QUESTIONS = [{
  text: "Koji je glavni grad Hrvatske?",
  answers: ["Split","Rijeka","Zagreb","Osijek"],
  correct: 2
}];

// ================== IGRAČ ==================
const player = localStorage.player || prompt("Ime igrača");
localStorage.player = player;
db.ref("players/"+player).set(true);

// ================== STATE ==================
let phase = "wait";
let answered = false;
let qIndex = 0;

// ================== TIMER ==================
function startTimer(sec, cb){
  let t = sec;
  document.getElementById("timer").innerText = t;
  const i = setInterval(()=>{
    t--;
    document.getElementById("timer").innerText = t;
    if(t<=0){
      clearInterval(i);
      cb();
    }
  },1000);
}

// ================== START ==================
setInterval(()=>{
  if(Date.now() >= QUIZ_START && phase==="wait"){
    startMain();
  }
},1000);

// ================== FAZE ==================
function startMain(){
  phase="main";
  answered=false;
  document.getElementById("status").innerText="GLAVNA FAZA";
  document.getElementById("question").innerText=QUESTIONS[qIndex].text;
  renderAnswers(["A!","B!","C!","D!","?"]);
  startTimer(MAIN_TIME, endMain);
}

function endMain(){
  phase="live";
  document.getElementById("status").innerText="LIVE PRIKAZ";
  showLive();
  startTimer(5, startQmark);
}

function startQmark(){
  phase="qmark";
  document.getElementById("status").innerText="? FAZA";
  renderAnswers(["A?","B?","C?","D?"]);
  startTimer(QMARK_TIME, reveal);
}

function reveal(){
  phase="reveal";
  document.getElementById("status").innerText="TOČAN ODGOVOR JE: "+
    ["A","B","C","D"][QUESTIONS[qIndex].correct];
}

// ================== ODGOVORI ==================
function renderAnswers(arr){
  const d=document.getElementById("answers");
  d.innerHTML="";
  d.classList.remove("locked");
  arr.forEach(a=>{
    const b=document.createElement("button");
    b.innerText=a;
    b.onclick=()=>submit(a);
    d.appendChild(b);
  });
}

function submit(v){
  if(answered) return;
  answered=true;
  document.getElementById("answers").classList.add("locked");
  db.ref("answers/"+qIndex+"/"+player).set(v);
}

// ================== LIVE PRIKAZ ==================
function showLive(){
  db.ref("answers/"+qIndex).once("value", snap=>{
    const l=document.getElementById("live");
    l.innerHTML="";
    snap.forEach(p=>{
      const s=document.createElement("span");
      s.innerText=p.key+" → "+p.val();
      l.appendChild(s);
    });
  });
}
</script>
</body>
</html>
