<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Kviz – Live Multiplayer</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;font-size:20px}
#timer{font-size:48px;color:yellow}
#question{font-size:28px;margin:20px}
#answers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:500px;margin:20px auto}
button{font-size:22px;padding:18px;border-radius:8px;border:none;cursor:pointer}
.a{background:#1e90ff}.b{background:#e67e22}.c{background:#2ecc71}.d{background:#9b59b6}
.q{background:#555}
.locked button{opacity:.4;pointer-events:none}
#live{margin-top:20px;font-size:16px;opacity:.9}
#leader{margin-top:30px}
table{width:90%;margin:auto;border-collapse:collapse}
th,td{border:1px solid #444;padding:6px}
</style>
</head>
<body>

<div id="top">
  <div id="roundInfo">Krug 1 / Pitanje 1</div>
  <div id="timer">--</div>
</div>

<div id="question">Čekanje početka kviza…</div>

<div id="answers"></div>

<div id="live"></div>

<div id="leader"></div>

<script>
// ================= CONFIG =================
const START_TIME = new Date('2026-01-13T18:30:00Z').getTime();
const ROUND_VALUES = [10,20,30,40,50,100];

// ================= FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef",
  storageBucket: "hpddd-b9bef.appspot.com",
  messagingSenderId: "520105963434",
  appId: "1:520105963434:web:5b25d1f9f28512ae1145d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= PLAYER / WATCH =================
let name = localStorage.getItem('player');
let watchMode = false;
if(!name){
  const n = prompt('Upiši ime (ili WATCH za gledanje)');
  if(n && n.toUpperCase()==='WATCH') watchMode=true;
  else { name=n; localStorage.setItem('player',n); }
}

if(!watchMode){ db.ref('players/'+name).set({joined:Date.now()}); }

// ================= QUESTIONS =================
let questions=[];
fetch('question.json').then(r=>r.json()).then(d=>{
  Object.values(d.rounds).forEach(r=>r.questions.forEach(q=>questions.push(q)));
});

let currentIndex=0;
let phase='wait';
let answered=false;
let phaseEnds=0;

// ================= SCORING =================
function calc(type,correct,val){
  if(type==='!') return correct?val:-val;
  if(type==='?') return correct?val/2:-val/2;
  if(type==='.') return correct?val/2:0;
  return 0;
}

// ================= RENDER ANSWERS =================
function renderAnswers(q,questionPhase){
  const div=document.getElementById('answers');
  div.innerHTML=''; div.classList.remove('locked'); answered=false;

  if(questionPhase==='main'){
    ['A','B','C','D'].forEach(l=>{
      ['!','.'].forEach(t=>{
        const b=document.createElement('button');
        b.className=l.toLowerCase(); b.innerText=l+t+' – '+q.answers[l];
        b.onclick=()=>send(l+t);
        div.appendChild(b);
      });
    });
    const qb=document.createElement('button'); qb.className='q'; qb.innerText='? LUKAVAC'; qb.onclick=()=>send('?'); div.appendChild(qb);
  }

  if(questionPhase==='qphase'){
    ['A','B','C','D'].forEach(l=>{
      const b=document.createElement('button'); b.className=l.toLowerCase(); b.innerText=l+'? – '+q.answers[l]; b.onclick=()=>send(l+'?'); div.appendChild(b);
    });
  }
}

function send(choice){
  if(answered||watchMode) return;
  answered=true;
  db.ref(`answers/${currentIndex}/${name}`).set({choice,time:Date.now()});
  document.getElementById('answers').classList.add('locked');
}

// ================= GAME LOOP =================
setInterval(()=>{
  const now=Date.now();
  if(now<START_TIME) return;

  const total=questions.length;
  const q=questions[currentIndex];
  if(!q) return;

  if(phase==='wait'){
    phase='main'; phaseEnds=now+20000;
    renderAnswers(q,'main');
    document.getElementById('question').innerText=q.text;
  }

  if(phase==='main' && now>phaseEnds){
    phase='qphase'; phaseEnds=now+10000;
    renderAnswers(q,'qphase');
  }

  if(phase==='qphase' && now>phaseEnds){
    phase='reveal'; phaseEnds=now+10000;
    reveal(q);
  }

  if(phase==='reveal' && now>phaseEnds){
    currentIndex++; phase='wait';
  }

  document.getElementById('timer').innerText=Math.max(0,Math.ceil((phaseEnds-now)/1000));
  document.getElementById('roundInfo').innerText=`Pitanje ${currentIndex+1}/${total}`;
},1000);

// ================= LIVE ANSWERS =================
db.ref('answers').on('value',snap=>{
  let txt='';
  snap.forEach(q=>{
    q.forEach(p=>{ txt+=`${p.key}: ${p.val().choice} | `; });
  });
  document.getElementById('live').innerText=txt;
});

// ================= REVEAL + LEADERBOARD =================
function reveal(q){
  const val=ROUND_VALUES[Math.floor(currentIndex/10)]||10;
  db.ref(`answers/${currentIndex}`).once('value',snap=>{
    snap.forEach(p=>{
      const c=p.val().choice; if(!c||c==='?') return;
      const l=c[0], t=c[1];
      const pts=calc(t,l===q.correct,val);
      db.ref('results/'+p.key).transaction(r=>{
        if(!r) r={points:0,q:0,ex:0,time:0};
        r.points+=pts; if(t==='?')r.q++; if(t==='!')r.ex++; return r;
      });
    });
  });
}

db.ref('results').on('value',snap=>{
  let arr=[]; snap.forEach(c=>arr.push({n:c.key,...c.val()}));
  arr.sort((a,b)=>b.points-a.points||b.q-a.q||b.ex-a.ex||a.time-b.time);
  let h='<table><tr><th>#</th><th>Igrač</th><th>Bodovi</th><th>?</th><th>!</th></tr>';
  arr.forEach((p,i)=>h+=`<tr><td>${i+1}</td><td>${p.n}</td><td>${p.points}</td><td>${p.q||0}</td><td>${p.ex||0}</td></tr>`);
  document.getElementById('leader').innerHTML=h+'</table>';
});
</script>
</body>
</html>
