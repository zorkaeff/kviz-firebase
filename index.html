<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Kviz</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial;
  background:#111;
  color:white;
  text-align:center;
}

h2 { margin-top:20px; }

#timer {
  font-size:48px;
  color:yellow;
  margin:20px;
}

#roundInfo {
  font-size:18px;
  opacity:0.8;
}

#question {
  font-size:28px;
  margin:20px;
}

#answers {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  max-width:420px;
  margin:30px auto;
}

button {
  padding:18px;
  font-size:22px;
  cursor:pointer;
}

.locked button {
  opacity:0.5;
  pointer-events:none;
}

#info {
  margin-top:20px;
  font-size:18px;
  opacity:0.9;
}
</style>
</head>

<body>

<h2>KVIZ</h2>

<div id="roundInfo"></div>
<div id="timer">--</div>
<div id="question">Čekamo admina…</div>

<div id="answers"></div>
<div id="info"></div>

<script>
// ================= PLAYER =================
let player = localStorage.getItem("player");
if (!player) {
  player = prompt("Upiši ime igrača");
  localStorage.setItem("player", player);
}

// ================= FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyB5jeu860fNmmysc51wcb5fej7Bz_6gW-Q",
  authDomain: "hpddd-b9bef.firebaseapp.com",
  databaseURL: "https://hpddd-b9bef-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hpddd-b9bef",
  storageBucket: "hpddd-b9bef.appspot.com",
  messagingSenderId: "520105963434",
  appId: "1:520105963434:web:5b25d1f9f28512ae1145d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// registracija
db.ref("players/" + player).set({
  joined: Date.now()
});

// ================= STATE =================
let answered = false;
let currentQuestion = null;

// ================= ANSWERS =================
function renderButtons(modes) {
  const div = document.getElementById("answers");
  div.classList.remove("locked");
  div.innerHTML = "";

  ['A','B','C','D'].forEach(l => {
    modes.forEach(m => {
      const b = document.createElement("button");
      b.innerText = l + m;
      b.onclick = () => submit(l + m);
      div.appendChild(b);
    });
  });
}

function submit(choice) {
  if (answered || !currentQuestion) return;
  answered = true;

  db.ref(`answers/${currentQuestion}/${player}`).set({
    choice,
    time: Date.now()
  });

  document.getElementById("answers").classList.add("locked");
  document.getElementById("info").innerText = "Odgovor spremljen";
}

// ================= TIMER =================
function startTimer(end) {
  clearInterval(window.timerInt);
  window.timerInt = setInterval(() => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    document.getElementById("timer").innerText = left + "s";
  }, 500);
}

// ================= GAME LISTENER =================
db.ref("game").on("value", snap => {
  const g = snap.val();
  if (!g) return;

  if (g.phase === "paused") {
    document.getElementById("question").innerText = "Kviz pauziran";
    return;
  }

  if (g.question) {
    currentQuestion = g.question;
    answered = false;
    document.getElementById("info").innerText = "";
    document.getElementById("roundInfo").innerText =
      `Krug ${g.round}`;
  }

  if (g.questionText) {
    document.getElementById("question").innerText = g.questionText;
  }

  if (g.phase === "main") {
    renderButtons(['!','.','?']);
  }

  if (g.phase === "questionMark") {
    if (!answered) {
      renderButtons(['?']);
    } else {
      document.getElementById("answers").innerHTML =
        "<i>Čekamo ostale igrače…</i>";
    }
  }

  if (g.phase === "reveal") {
    document.getElementById("answers").innerHTML =
      `<b>Točan odgovor: ${g.correct}</b>`;
  }

  if (g.phase === "leaderboard") {
    document.getElementById("answers").innerHTML =
      "<i>Prikaz rezultata…</i>";
  }

  if (g.phaseEndsAt) {
    startTimer(g.phaseEndsAt);
  }
});

// ================= WAITING INFO =================
setInterval(() => {
  if (!currentQuestion) return;

  db.ref("players").once("value", pSnap => {
    db.ref(`answers/${currentQuestion}`).once("value", aSnap => {
      const waiting = [];
      pSnap.forEach(p => {
        if (!aSnap.hasChild(p.key)) waiting.push(p.key);
      });
      if (waiting.length && !answered) {
        document.getElementById("info").innerText =
          "Čekamo: " + waiting.join(", ");
      }
    });
  });
}, 1000);
</script>

</body>
</html>
